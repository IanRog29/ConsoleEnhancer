# Compila ConsoleEnhancer en Windows con el csc de .NET Framework 4.8 que trae el sistema (sin Visual Studio), pasa la prueba de
# deteccion con los PCs simulados y comprueba que en el repositorio no hay binarios, nada no redistribuible ni datos personales.
# Con una etiqueta v* (git tag v1.0.0 && git push origin v1.0.0) ademas monta el zip con scripts\empaquetar.ps1 (baja NVIDIA
# Streamline de su release oficial, con su SHA-256) y crea la Release de GitHub con el zip y su .sha256.
name: compilar

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar el repositorio (binarios, no redistribuible, datos personales)
        shell: pwsh
        run: |
          $todos = @(git ls-files)
          # (git ls-files --eol: "i/-text" = contenido binario en el indice)
          $bin = @(git ls-files --eol | Where-Object { $_ -match '^i/-text' } | ForEach-Object { ($_ -split "`t", 2)[1] })
          $permitidos = @('resources/prisma.ico', 'resources/prisma_512.png')
          $bin = $bin | Where-Object { $permitidos -notcontains $_ }
          if ($bin) { 'Binarios en el repositorio (solo se permiten los iconos propios):'; $bin; exit 1 }
          $malos = $todos | Where-Object { $_ -match '(?i)(nvngx_|dlssg_sm86|DLSSNR-DLL|NGX_OTA|\.(exe|dll|pdb|obj|lib|zip|7z|log)$|\.antes-|(^|/)(terceros|datos|juegos|logs|extras|bin|dist|obj)/|consoleenhancer\.ini$|switch2\.ini$|privado\.txt$)' }
          if ($malos) { 'Ficheros que no deben ir al repositorio:'; $malos; exit 1 }
          $personal = git grep -n -I -E '[A-Za-z]:\\Users\\|[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,}' -- . ':!LICENSE'
          # git grep devuelve 1 cuando NO encuentra nada (lo normal aqui): no debe contar como fallo del paso
          $LASTEXITCODE = 0
          if ($personal) { 'Posibles datos personales (rutas de usuario o correos):'; $personal; exit 1 }
          Get-Content scripts/components.json -Raw | ConvertFrom-Json | Out-Null
          'Repositorio limpio'
          # pwsh en Actions sale con el ultimo $LASTEXITCODE: forzar 0 si todas las comprobaciones pasaron
          exit 0

      - name: Lanzador (build.bat)
        shell: cmd
        run: call .\build.bat

      - name: Motor (build_motor.bat)
        shell: cmd
        run: call .\build_motor.bat

      # (1.2.4) las piezas propias del motor en C++ con el MSVC del runner: PrismaNr.dll (con las DOS cabeceras publicas de NGX de
      # github.com/NVIDIA/DLSS en una version fija, con su SHA-256; no van en el repositorio). (1.2.4 ronda 6: PrismaFg ya no existe)
      - name: Cabeceras de NGX (scripts\descargar_cabeceras_ngx.ps1)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\descargar_cabeceras_ngx.ps1

      - name: PrismaNr.dll (build_prismanr.bat)
        shell: cmd
        run: |
          call .\build_prismanr.bat || exit /b 1

      # (1.2.4 ronda 6) CeFsrFg.dll = la FSR FG x3 / x4 del motor: la interpolacion de FSR 3.1 de AMD (codigo MIT) con nuestro parche.
      # build_fsrfg.bat baja solo lo necesario del FidelityFX SDK de AMD en su etiqueta v1.1.4 (y comprueba que es el commit c6efa6b),
      # aplica parches\fidelityfx-fi-multi.patch y compila sus shaders y la DLL. El SDK no va al repositorio
      - name: CeFsrFg.dll (build_fsrfg.bat, FidelityFX SDK v1.1.4 de AMD)
        shell: cmd
        run: |
          call .\build_fsrfg.bat || exit /b 1

      - name: Prueba de deteccion (tests\build_deteccion.bat)
        shell: cmd
        run: call .\tests\build_deteccion.bat

      - name: DeteccionTest con los PCs simulados
        shell: pwsh
        run: |
          & tests\bin\DeteccionTest.exe --simula=todo --sin-d3d12 --salida=deteccion.txt
          if ($LASTEXITCODE -ne 0) { Get-Content deteccion.txt -Tail 40; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleEnhancer-bin
          path: |
            bin/ConsoleEnhancer.exe
            bin/engine/ConsoleEnhancerEngine.exe
            bin/engine/PrismaNr.dll
            bin/engine/CeFsrFg.dll
            deteccion.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache de NVIDIA Streamline (terceros\_descargas)
        uses: actions/cache@v4
        with:
          path: terceros/_descargas
          key: terceros-${{ hashFiles('scripts/components.json') }}

      - name: NVIDIA Streamline (de su release oficial, con su SHA-256)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\descargar_dependencias.ps1 -Solo streamline

      - name: Cabeceras de NGX (para PrismaNr)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\descargar_cabeceras_ngx.ps1

      - name: Compilar
        shell: cmd
        run: |
          call .\build.bat || exit /b 1
          call .\build_motor.bat || exit /b 1
          call .\build_prismanr.bat || exit /b 1
          call .\build_fsrfg.bat || exit /b 1

      # (1.2.3) Firma de codigo de los exe, OPCIONAL: solo con los secretos del repositorio CE_FIRMA_PFX (el .pfx en base64) y
      # CE_FIRMA_CLAVE (su contrasena), en Settings > Secrets and variables > Actions. Sin ellos, todo como siempre: los exe sin firmar.
      # Firma scripts\firmar.ps1 con signtool (SHA-256 y sello de tiempo); las DLL de NVIDIA ya vienen firmadas
      - name: Firma de codigo (solo si hay certificado)
        shell: pwsh
        env:
          CE_FIRMA_PFX: ${{ secrets.CE_FIRMA_PFX }}
          CE_FIRMA_CLAVE: ${{ secrets.CE_FIRMA_CLAVE }}
        run: |
          if (-not $env:CE_FIRMA_PFX) { 'Sin certificado (secreto CE_FIRMA_PFX): los exe van sin firmar'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'ce_firma.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CE_FIRMA_PFX))
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\firmar.ps1 -Pfx $pfx
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally { Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue }

      - name: Montar el zip (scripts\empaquetar.ps1)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\empaquetar.ps1 -Zip -Version "${{ github.ref_name }}" -Web "${{ github.server_url }}/${{ github.repository }}"

      - name: Notas de la version (CHANGELOG.md)
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $v = $tag.TrimStart('v')
          $lineas = Get-Content CHANGELOG.md -Encoding UTF8
          $notas = New-Object System.Collections.Generic.List[string]
          $dentro = $false
          foreach ($l in $lineas) {
            if ($l -match '^## ' -or $l -match '^\[[^\]]+\]: ') { if ($dentro) { break }; if ($l -match ('^## \[?v?' + [regex]::Escape($v) + '(\]|\s|$)')) { $dentro = $true; continue } }
            if ($dentro) { $notas.Add($l) }
          }
          if ($notas.Count -eq 0) { $notas.Add("ConsoleEnhancer $tag") }
          $notas.Add('')
          $notas.Add('**Download / Descarga:** `ConsoleEnhancer-' + $tag + '.zip` (below / abajo). Unzip and open `ConsoleEnhancer.exe`: on first start it downloads Intel XeSS and AMD FSR from their official pages, then the wizard runs. / Descomprime y abre `ConsoleEnhancer.exe`: la primera vez baja Intel XeSS y AMD FSR de sus paginas oficiales y luego sale el asistente.')
          $notas.Add('')
          $notas.Add('SHA-256: `' + ((Get-Content "dist/ConsoleEnhancer-$tag.zip.sha256" -Raw).Split(' ')[0]) + '` (each file inside / cada fichero de dentro: `ConsoleEnhancer-' + $tag + '.files.sha256`)')
          $notas.Add('')
          $notas.Add('License GPL-3.0 (+ LICENSE-EXCEPTION.txt). Includes unmodified NVIDIA Streamline / DLSS / Reflex (licenses\), the engine''s CeFsrFg (AMD FidelityFX SDK 1.1.4 frame interpolation, MIT, modified) and the engine''s own PrismaNr, which loads files you add yourself without NVIDIA''s NGX check (see README). Does not include nvngx_dlssnr.dll or any modified NVIDIA file. / Licencia GPL-3.0 (+ LICENSE-EXCEPTION.txt). Incluye NVIDIA Streamline / DLSS / Reflex sin cambios (licenses\), CeFsrFg del motor (la interpolacion de AMD FidelityFX SDK 1.1.4, MIT, cambiada) y la pieza propia del motor PrismaNr, que carga los archivos que pones tu sin la comprobacion de NGX de NVIDIA (ver README). No incluye nvngx_dlssnr.dll ni ningun archivo de NVIDIA modificado.')
          Set-Content -LiteralPath notas.md -Value $notas -Encoding UTF8

      - name: Crear la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $extra = @()
          if ($tag -match '-(alpha|beta|rc|pre)') { $extra += '--prerelease' }
          # (la etiqueta movida a otro commit: la Release ya existe -> se le cambian el zip y las notas)
          # (1.2.3) ademas del zip y su .sha256, el SHA-256 de cada fichero de dentro (.files.sha256: para comprobar una copia o
          # mandarle a Microsoft / a un antivirus un falso positivo con los ficheros exactos)
          $ficheros = @("dist/ConsoleEnhancer-$tag.zip", "dist/ConsoleEnhancer-$tag.zip.sha256", "dist/ConsoleEnhancer-$tag.files.sha256")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @ficheros --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            gh release edit $tag --title "ConsoleEnhancer $tag" --notes-file notas.md
          } else {
            gh release create $tag @ficheros --title "ConsoleEnhancer $tag" --notes-file notas.md @extra
          }
          exit $LASTEXITCODE
