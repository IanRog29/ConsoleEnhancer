# mpv.conf de ConsoleEnhancer (va en mpv\portable_config\: con esta carpeta, mpv no lee la configuracion del usuario de
# %APPDATA%\mpv, ni sus scripts ni su input.conf, que podrian cambiar la imagen, el retraso o pintar encima de la captura).
#
# Todo lo que usa la app va en la linea de comandos que monta src\Lanzador\Switch2Magpie.cs (BuildMpvArgs: perfil low-latency,
# gpu-next con D3D11, sin colas, el filtro de imagenes repetidas, scripts\s2_aa.glsl y scripts\ce_power.lua). Aqui solo lo que
# protege de lo que pudiera haber instalado en el PC:

# Ningun script de las carpetas de configuracion (los de la app van con --script=)
load-scripts=no
# Nada de recordar la posicion ni de guardar capturas de pantalla en sitios raros
save-position-on-quit=no
