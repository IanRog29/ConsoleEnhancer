# resources\base.ini - ajustes generales de ConsoleEnhancer (los probados en Switch2Magpie: motor, generacion, telon, DLSS 5...).
# El asistente lo copia al ini y anade debajo lo de tu hardware (capturadora, grafica, pantalla, consola, modelos).
# 20-11: las escalas que dependen de la grafica (tabla_dlss5_*, tabla_modelo_*, motor_dlss5_entrada_*, motor_modelo_60_dlssg) ya NO van aqui:
# las escribe el asistente para TU grafica (src\Lanzador\Escalas.cs: lo medido en una RTX 4060 Ti escalado por el indice de la grafica) y
# despues se ajustan solas jugando (escalas_adaptables=1). Lo que queda aqui son ajustes generales (calidad, ritmo, avisos).
audio_canales=8
close_on_poweroff=1
# Al cerrarse la app por la consola apagada, apagar tambien el PC (apagar_pc=1; lo elige el asistente o el menu de la bandeja, al final
# del ini). Antes, un aviso de apagar_pc_aviso_s segundos que se cancela con el mando, una tecla o el raton (0 = sin aviso)
apagar_pc_aviso_s=15
# 1.0.14: que hace el PC con apagar_pc=1 (apagar_pc_modo):
#   espera    (de serie) como una consola en reposo: pantalla apagada y casi sin gasto; al encender la consola (lo ve la capturadora),
#             encender un mando o pulsar una tecla vuelve la pantalla y se abre ConsoleEnhancer
#   suspender suspension de verdad (S3, gasta casi nada); solo lo despiertan los teclados/mandos que Windows deja (aviso de UAC)
#   apagar    lo de antes
# espera_suspender_min: en espera, pasados estos minutos sin nada, suspension de verdad (0 = nunca)
apagar_pc_modo=espera
espera_suspender_min=0
# espera_volver_sin_consola_s: despierto desde la espera (mando o tecla) y sin encender la consola en estos segundos, otra vez en espera (0 = no)
espera_volver_sin_consola_s=90
# 1.2.1: con apagar_pc=1, desde que se ve la consola apagada hasta que vuelve su imagen, una cubierta negra en todas las pantallas (sin
# cursor) y la barra de tareas oculta (espera_ocultar_barra=0: la barra no se toca). Vuelve sola al ver la consola, al cerrar la app, al
# pasar a "como un PC normal" o al desinstalar; si la app muere, la vuelve a poner un proceso pequeno que la vigila (--ce-guarda-barra)
espera_ocultar_barra=1
# espera_cpu_max: en espera, un plan de energia propio (copia del Economizador, se borra al despertar) con el procesador a este % y sin
# turbo, el disco duro parado a los 10 min y la pantalla a 1 min (0 o 100 = el Economizador tal cual)
espera_cpu_max=50
# espera_sonda_fuente: SOLO PRUEBAS, lo que mira la sonda de la espera en vez de la capturadora (p. ej. av://lavfi:...; vacio = la
# capturadora; con test_source y esto vacio, sin sonda). Pruebas sin consola: --prueba-cadena=<s>, --prueba-espera-simulada=<s>
espera_sonda_fuente=
# 1.2.2: espera_sonda_cada_ms: en espera, la capturadora se mira un momento (~0,35 s) cada tantos ms y entre medias queda parada (la sonda
# propia, ConsoleEnhancer.exe --ce-sonda: ~1 % de un nucleo y ~13 despertares/s en vez de ~10-13 % y ~300-400/s de la de mpv de la 1.2.1).
# La consola se ve de media ~0,5 s mas tarde (como mucho ~1,2 s) que mirando sin parar; 1000 = mas rapida. 1.2.4 (sin mpv): 0 = 1000, y si
# la capturadora no le vale (sin YUY2 / NV12) o falla 3 veces, otra vez a los 30 s (mientras, la despiertan los mandos o una tecla)
espera_sonda_cada_ms=2000
poweroff_stall_ms=1500
apagado_espera_s=3
apagado_espera_arranque_s=25
apagado_espera_home_s=0
apagado_home_tras_juego_s=1.5
