motor_extra=mvpx=1 mvpx_margen=2 mvexacto=0.1 mvsesgo=0.1 mvruido=2 mvflat=1 liso=6 mvlargo=0.008 mvlargo_rel=1 mvapertura=8 mvapertura_puerta=1 mvsuave=0 mvconsenso=2 mvconsenso_eje=1 mvtemporal=1 corte_medias=1 fg_vectores=3 fg_vectores_radio=2 fg_profundidad=4 mvsub=1 mv_ligero=3000000 fg_menus=1 fg_vectores_completos=0
