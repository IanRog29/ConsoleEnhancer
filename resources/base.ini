#
# ---- 19-11 (de Prisma: ESCRITORIO, DLSS5, GENERACION, FLUIDEZ) ----
# Escritorio de Windows negro mientras la app esta abierta (sin imagen ni iconos, barra oculta) y el normal al cerrarla a mano; si se
# apaga el PC por la consola se queda negro para el siguiente arranque. Apagado de serie: el asistente o el menu de la bandeja lo
# encienden (va bien con "Iniciar con Windows"). A mano: ConsoleEnhancer.exe --restaurar-escritorio
escritorio_negro=0
# DLSS 5 con 2-3 pasadas: Magpie vuelve a pasar el modelo sobre lo que sale de la anterior; con la misma fuerza en todas el efecto se
# acumula (halo oscuro en el texto, color lavado, mas parpadeo). Solo con 2-3 pasadas (con 1 nada cambia):
#   dlss5_fuerza_pasadas   fuerza de cada pasada 1a,2a,3a | dlss5_pasadas_contener  Overcorrection Suppression si el modo no trae la suya
#   dlss5_pasadas_color    Chroma Strength del residuo    | dlss5_pasadas_enfoque   el enfoque CAS por esto si el modo no trae el suyo
# Como antes: 1,1,1 / 0 / 1 / 1. Medido en una RTX 4060 Ti con la imagen quieta (modo 30, 1080p)
dlss5_fuerza_pasadas=1,0.6,0.5
dlss5_pasadas_contener=0.7
dlss5_pasadas_color=0.7
dlss5_pasadas_enfoque=0.5
# Selector del TIPO de generacion de fotogramas (L3 jugando, o Ctrl+G con el teclado sobre la imagen): la lista del modo de ahora; cada
# pulsacion el siguiente, 1,4 s sin pulsar y se pone. Las listas (generacion_lista_60 / _30) las escribe el asistente con lo que tiene
# TU grafica y lo medido (abajo, en el plan). Ajustes POR TIPO: la clave del modo con el tipo en vez de "_fg" (60_sm, 30_dlssg, 30_xess,
# 30_fsr3, 30_vfg) y detras lo de siempre (_1080 / _1440 / _720 / _4k, _p2 / _p3); sin la del tipo, la de "_fg".
# Lo que se midio en Prisma (RTX 4060 Ti, 19-11) y vale para todas: XeSS FG con captura 1080p no arranca (la app no lo ofrece ahi); FSR 3 FG
# en el 30 se queda en ~29,4-29,6 reales (con Smooth Motion o DLSS FG no se ofrece); DLSS FG en el 60 no llega a ritmo en RTX 40 (Reflex
# con la sincronizacion). Las escalas de cada tipo (tabla_dlss5_30_xess...) las escribe el plan para tu grafica.
# XeSS FG / FSR 3 FG en el modo 30 por DXGI con la sincronizacion del driver "cada 2 refrescos" (0 = DirectComposition)
dxgi_30_xess=1
dxgi_30_fsr3=1
# Fluidez (solo para probar, apagado de serie): mpv_gpu_prioridad=tiempo_real (la prioridad de GPU de Magpie para mpv) y
# magpie_cola_cpu=N (imagenes en cola de la CPU en el perfil de NVIDIA de Magpie.exe; de serie 1). Cada 5 min el log apunta
# "Ritmo de Magpie" (imagenes reales tarde o perdidas y picos de la grafica)

# DLSS 5 en el motor propio (20-11-2026): con motor=propio, DLSS 5 encendido y 1 pasada, la imagen la hace el motor (sin mpv, la
# composicion de Windows ni la captura de Magpie) con bin\engine\PrismaNr.dll (build_prismanr.bat) y la nvngx_dlssnr.dll de bin\magpie
# (no se distribuye). En Prisma (RTX 4060 Ti), modo 30 + DLSS FG: ~49 ms de punta a punta a 1440p y ~55 a 4K frente a 72-94 por Magpie.
# Sin la DLL o sin PrismaNr.dll el motor sigue sin DLSS 5. 2-3 pasadas siguen por Magpie
motor_dlss5=0
# % de entrada de DLSS 5 en el motor (motor_dlss5_entrada_30 / _30_4k): los escribe el plan para tu grafica y el motor los ajusta solo
# (escalas_adaptables=1). motor_dlss5_entrada=N fija uno para todo (0 = esos y, en el 60, la tabla de DLSS 5)
#
# ---- 20-11 (de Prisma: CIERRES y LATENCIA4) ----
# La imagen parada no es la consola apagada (src\Lanzador\Cierres.cs; motor: EngineCuelgue.cs). Antes de cerrar por "no llegan imagenes"
# se mira si el motor dice que la grafica esta parada, si la capturadora le sigue mandando imagenes o si la consola sigue sonando: si es
# asi se espera y, a los cuelgue_relanzar_ms, se vuelve a abrir solo la imagen (motor / mpv) sin cerrar la app. 0 = como antes
apagado_confirmar=1
cuelgue_relanzar_ms=8000
# apagar_pc (si esta puesto) solo si en el ultimo minuto no hubo un reinicio de la grafica ni la grafica parada o perdida (0 = siempre)
apagar_pc_confirmar=1
# 1.2.1 (src\Lanzador\CapturaSegura.cs): si tras cambiar el formato de la capturadora (otra captura, otro modo, el menu de la consola, un
# perfil) no llega ninguna imagen y la consola estaba encendida (su imagen o su sonido), la app no se queda "esperando a que se encienda":
# a los captura_segura_s (con mpv; el motor recien abierto, el triple) prueba otro formato que la capturadora si da (el mismo tamaño a
# 59,94, el ultimo que funciono, 1080p) y avisa en pantalla. 0 = como antes
captura_segura=1
captura_segura_s=6
# Mientras Magpie se (re)abre, el motor en espera juega encima lo mas ligero (puente_ligero): 1 = DLSS E sin generacion y, en el modo
# 120, FSR 1 (con E a 120 imagenes/s Magpie tardaba el doble en arrancar); 2 = FSR 1 siempre; 0 = con los ajustes del modo
puente_ligero=1
# Menu / HOME de la consola a 4K nativo con el motor: sin DLSS 5 (0: el menu tal cual, como con Magpie, y ~10 ms menos de retraso;
# 1 = tambien DLSS 5 en el menu)
motor_dlss5_home=0
# VRR del motor: lo decide vrr=auto|0|1 (abajo, en el plan; src\Lanzador\ImagenCe.cs; motor_vrr de Prisma no cuenta aqui). Con VRR y
# la generacion, motor_vrr_fg_vsync: -1 = auto (sin sincronizacion si la salida cabe en la pantalla: modo 30; con ella en el 60), 0 = nunca
# (menos retraso en el 60 + FG pero con posibles cortes abajo), 1 = siempre
motor_vrr_fg_vsync=-1
# Modo 60 con DLSS FG del motor: refresco fijo (G-SYNC apagado SOLO en el perfil de NVIDIA de ConsoleEnhancerEngine.exe mientras se juega
# asi; se quita al salir y, si la app se cae, al volver a abrirla). Con G-SYNC, Reflex limita la salida a ~hz - hz^2/3600 (116 a 120 Hz):
# con 59,94 de la consola se pierden ~2 imagenes reales por segundo. auto = solo con NVIDIA, VRR en el motor y si ese tope no deja pasar
# el doble de las imagenes de la captura (pantalla de 120 Hz si; 144 Hz o mas, 119,88 Hz o sin VRR, no). 1 = siempre (NVIDIA), 0 = nunca
motor_60fg_refresco_fijo=auto
# Del motor (por motor_extra si hace falta; de serie asi): dlss5_guardian=1 (DLSS 5 en el motor se aligera de golpe si la grafica pasa
# mucho de su tope: el freno de emergencia de las escalas que se adaptan), cuelgue_ms=700, cuelgue_salir_s=15
#
# ---- 20-11 (de Prisma: PS5JUEGO) ----
# Con la PS5 (y la Xbox Series, SIN PROBAR con la consola) cada juego se reconoce por su nombre en el centro de control / conmutador (PS5)
# o en la Guia / fichas (Xbox) y se le guarda su perfil, como con la Switch 2. Si no se reconoce, el perfil unico de la consola. 0 = ese
# perfil unico siempre
ps5_reconocer_juegos=1
xbox_reconocer_juegos=1
#
# ---- 20-11 (de Prisma: HZ120 y HDCP120) ----
# Modo 120 fps (esports, baja latencia, sin generacion): el boton de modo pasa 30 -> 60 -> 120 solo si la consola saca 120, la tele va a
# 120 Hz o mas y la captura de ahora esta en capturas_120 (la escribe el plan con los formatos que lista TU capturadora a 120; vacio =
# sin 120). A 4K el boton sigue 30 <-> 60 (la captura no se baja sola). permitir_120=auto | 1 | 0
permitir_120=auto
# Aviso de HDCP: solo con la imagen negra de verdad y la consola en silencio hdcp_aviso_s seguidos (antes saltaba con escenas oscuras)
hdcp_aviso=1
hdcp_aviso_s=20

# ---- 21-11 (1.0.9) ----
# Motor de reserva: jugando con el motor propio, otro preparado en segundo plano con el otro tipo de generacion del modo (Smooth Motion
# / DLSS FG): cambiar entre ellos con L3 pasa de 4-5 s a ~0,5 s. Ocupa ~0,9 GB de memoria grafica mientras espera. 0 = sin el
motor_reserva=1
# XeSS / FSR 3.1-4 de escalador y FSR 3 FG los hace tambien el motor propio con las DLL de magpie\ (escalador=xess | fsr4 | fsr3;
# FSR 3 FG con L3). Sin DLSS, el asistente pone XeSS (GTX, Intel Arc) o FSR 4 (AMD RX 6000/7000/9000)
