contener_30_fg_4k_p3_dlss5=0.85

# ---- 24-11 (1.3.3): Enhanced RT (experimental; src\Motor\Engine\EngineRt.cs, src\Lanzador\EnhancedRt.cs) ----
# Trazado de rayos sobre la imagen en el motor propio: oclusion de contacto y luz rebotada trazadas sobre un relieve estimado de la captura
