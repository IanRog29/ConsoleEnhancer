# 1.0.5: fg_vectores_completos=1 = con DLSS 5 en el modo 30 la generacion DLSS recibe los vectores completos por punto (menos fallos en las imagenes inventadas)
# 1.0.6: fg_vectores_completos=0 y el giro (corte_giro, mvglobal, mvlargo_grueso) apagados: los dos daban halos en las imagenes que inventa la generacion DLSS
# 1.0.7: fg_vectores=3 = la generacion DLSS recibe un solo vector, el del giro de la camara (los vectores por bloque daban halos en GTA); el giro vuelve a estar encendido (un giro rapido no es un corte de escena)
# 1.2.1 (de serie en el motor, no hace falta ponerlas): fg_global=1 = ese vector de la camara con su propia busqueda en toda la imagen (antes
#   salia como mucho 32 px y 0 en los paneos de 5-64 px a 4K); fg_quieto=1 = con la camara moviendose, lo quieto con textura (interfaz, el
#   personaje que sigue la camara) va con vector 0; fg_quieto_prof=1 = y delante en la profundidad de la generacion (con fg_profundidad > 0).
#   mvsr_xess_ffx=1 = XeSS / FSR 3.1-4 de escalador y FSR 3 FG del motor con vectores de movimiento (antes a 0). fg_solo_camara=1 = si solo
#   la generacion usa los vectores (4K nativo sin DLSS 5), sin la busqueda por bloques (~2 ms menos de grafica a 4K). Todas a 0 = como antes
motor_extra=mvpx=1 mvpx_margen=2 mvexacto=0.1 mvsesgo=0.1 mvruido=2 mvflat=1 liso=6 mvlargo=0.008 mvlargo_rel=1 mvapertura=8 mvapertura_puerta=1 mvsuave=0 mvconsenso=2 mvconsenso_eje=1 mvtemporal=1 corte_medias=1 fg_vectores=3 fg_vectores_radio=2 fg_profundidad=4 mvsub=1 mv_ligero=3000000 fg_vectores_completos=0
